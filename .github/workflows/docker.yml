name: docker

on:
  push:
    branches: [main]
    paths: ['server/**', 'docker/**', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/fswolf/kokoro-reader:latest
            ghcr.io/fswolf/kokoro-reader:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
